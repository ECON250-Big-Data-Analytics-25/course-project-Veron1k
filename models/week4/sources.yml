version: 2

sources:
  - name: vanepska
    database: econ250-2025
    schema: vanepska
    tables:
      - name: week3_arxiv
      - name: " sheet_external_practice"

  - name: test_dataset
    database: econ250-2025
    schema: test_dataset
    tables:
      - name: air_raid_alerts_ua
        loaded_at_field: started_at
        freshness:
          error_after:
            count: 2
            period: day
      - name: week3_arxiv
      - name: week5_web_transactions
        description: |
            Transaction-level data. Can be combined with week5_web_visits using `visitId` field

            May contain duplicates, for **deduplicated** data look at model
        columns:
          - name: date
            description: date for the transactions

          - name: visitId
            description: '{{ doc("visitid_description") }}'
          - name: transaction.transactionId
            data_tests:
            - not_null:
                config:
                  severity: error
                  error_if: ">10"
                  warn_if: ">0"
      - name: week5_web_visits
        columns:
          - name: visitId
            description: '{{ doc("visitid_description") }}'
      - name: week5_hits
        columns:
          - name: visitId
            description: '{{ doc("visitid_description") }}'


      - name: assignment5_input
        description: "The table contains Wikipedia pageview data for both desktop ( uk ) and mobile
                      ( uk.m ) versions (so, similar to previous assignment but with different date ranges)"
        columns:
          - name: datehour
            description: "Timestamp representing the hour of the pageview"
          - name: wiki
            description: "Platform of Wikipedia (uk or uk.m)"
          - name: title
            description: "Title of the Wikipedia page"
          - name: views
            description: "Number of views for the page during the hour"


  - name: google_trends
    database: bigquery-public-data
    schema: google_trends
    tables:
      - name: international_top_terms
        loaded_at_field: TIMESTAMP(refresh_date)
        freshness:
          filter: "refresh_date >= current_date() - 7"
          error_after:
            count: 2
            period: day

